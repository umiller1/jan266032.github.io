<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Box Model - Widgets</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="weather">
            <img src="images/sun.svg" alt="weather">
            <p id="deg">81&deg;</p>
            <p>14:26</p>
            <p id="date">
                Wed 20 May
                <br>
                Seattle, WA
            </p>
        </div>

        <div id="calendar">
            <h5 class="weekday">FRIDAY</h5>
            <p class="date">26</p>
            <div class="event">
                <h5>Client Meeting...</h5>
                <p>Work</p>
                <p>10:00 — 11:30 AM</p>
            </div>
        </div>

    </body>
</html>
