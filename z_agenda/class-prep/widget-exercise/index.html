<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Box Model - Widgets</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="location" class="widget">
            <img src="images/hotel.jpg" alt="locale.">
            <h2>Biltmore Hotel</h2>
            <p>
                1200 Anastasia Ave, Coral Gables
                <br>
                FL 33134
            </p>
        </div>
        <div class="widget stats">
            <p>New Users</p>
            <h2>2.31k</h2>
            <p>
                <img src="images/up-trend.svg" alt="graph">
                vs Prev Week
            </p>
        </div>
        <div class="widget stats">
            <p>New Posts</p>
            <h2>200</h2>
            <p>
                <img src="images/down-trend.svg" alt="graph">
                vs Prev Week
            </p>
        </div>
        <div class="widget stats">
            <p>Total Sales</p>
            <h2>0.5k</h2>
            <p>
                <img src="images/up-trend.svg" alt="graph">
                vs Prev Week
            </p>
        </div>

        <!-- Advanced Widget Challenge -->
         <div id="weather">
            <img src="images/sun.svg" alt="weather">
            <p id="deg">81&deg;</p>
            <p>14:26</p>
            <p id="date">
                Wed 20 May<br>
                Seattle, WA
            </p>
         </div>
    </body>
</html>
