<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Icons | Demo</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <!-- 
            Create an img element. Use favorite.png.
            Mention that the img was sized before being brought in.

            Add a dummy anchor. Use "Add to Favorites" for the CTA.
            Explain it is common for buttons and links, usually in navigations,
            to have iconography next to them.

            Ask why the anchor and img sit side by side instead of stacking.
            Explain why.

            Add a width attribtue to img. Set it to 50. Refresh that PNGs are
            raster images, so, they pixelate at resizing.

            Swap .png for .svg. Refrest that SVGs are vectors are do not
            pixelate upon resizing.
        -->
        <img src="images/favorite.svg" alt="Favorite icon." width="25">
        <a href="#">Add to Favorites</a>
        
        <!-- 
            Add a paragraph that says "We are eco friendly". Add an img before
            "eco friendly". Explain that this is a decorative icon implemented
            using an inline image.

            Refresh why the img sits next to the text.

            Explain that decorative icons require alt text that do not hurt the
            flow or structure of the text around the img.

            Show a cleaner/prettier version by splitting the paragraph. Add a
            width attribute. Set it to 10.
        -->
        <p>
            We are
            <img src="images/leaf.svg" alt="certified" width="10">
            eco friendly!
        </p>
    </body>
</html>
