<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="layout">
            <div class="color-palette">
                <h2>Mid-day Workout</h2>
                <h4 id="p1-c1" class="color">#84aeff</h4>
                <h4 id="p1-c2" class="color">#e07831</h4>
                <h4 id="p1-c3" class="color">#00aeae</h4>
            </div>
            <div class="color-palette">
                <h2>Westchester Harmonics</h2>
                <h4 id="p2-c1" class="color">#ff0065</h4>
                <h4 id="p2-c2" class="color">#e297a0</h4>
                <h4 id="p2-c3" class="color">#f7f5dd</h4>
                <h4 id="p2-c4" class="color">#9bdeac</h4>
            </div>
            <div class="color-palette">
                <h2>False Moon</h2>
                <h4 id="p3-c1" class="color">#bdd6cf</h4>
                <h4 id="p3-c2" class="color">#81b5a8</h4>
                <h4 id="p3-c3" class="color">#c2d2e9</h4>
                <h4 id="p3-c4" class="color">#93adcf</h4>
            </div>
        </div>
    </body>
</html>
